services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frozenrss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frozenrss}
      POSTGRES_DB: ${POSTGRES_DB:-frozenrss}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-frozenrss} -d
            ${POSTGRES_DB:-frozenrss}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8025" ]
      interval: 10s
      timeout: 5s
      retries: 5

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1
    init: true
    ipc: host
    # cap_add:
    #   - SYS_ADMIN
    ports:
      - "6000:6000"
    command: npx playwright run-server --port 6000 --host 0.0.0.0
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:6000" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mailpit_data:
